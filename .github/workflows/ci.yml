name: ci.yml
on:
  push:
    branches:
      - dev
      - vbe
  pull_request:
    branches:
      - dev
      - vbe

jobs:
  lint-and_security_test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Node.js v22 (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Instalar Dependências
        run: npm ci

      - name: Rodar ESLint
        run: npm run lint

      - name: Rodar Prettier
        run: npm run format:check

      - name: Executar Auditoria
        run: npm audit
